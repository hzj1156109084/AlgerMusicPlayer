# Gradle 分发包来源。
#
# 只改了一处：distributionUrl 指向腾讯云镜像。
#
# 原因：默认的 https://services.gradle.org/distributions/... 从本机访问会超时
# （实测首次构建报 `timeout (10000ms)`，即 wrapper 自带的 10 秒上限）。
# 腾讯镜像实测 HTTP 200、且确实有 8.14.3-all.zip 这个文件。
#
# 版本本身没动 —— android/build.gradle 里是 AGP 8.13.0，官方配对的正是
# Gradle 8.14.3。本机 SDK 目录下虽然已有一个解压好的 gradle-9.6.1，
# 但换成它属于跨大版本的 AGP/Gradle 错配，不值得冒这个险。
#
# networkTimeout 从 10000 放宽到 60000，避免镜像偶发慢速时再次中断。
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-8.14.3-all.zip
networkTimeout=60000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
